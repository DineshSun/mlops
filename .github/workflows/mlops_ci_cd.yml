```
name: MLOps End-to-End CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-test-and-train:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository code
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Set up Python environment
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # 3. Cache dependencies for faster pipeline execution
    - name: Cache Pip Dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # 4. Install project requirements
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 5. Code Quality Check (Linting)
    - name: Lint Code with Flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Warning checks for code complexity and formatting
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # 6. Step 1 Execution (Data Acquisition)
    - name: Acquire &amp; Clean Data
      run: |
        python step1_data_acquisition_eda.py

    # 7. Run Pytest Unit Test Suite
    - name: Execute Unit Tests
      run: |
        pytest tests/ --verbose --junitxml=test-reports/results.xml

    # 8. Step 2 &amp; 3 Execution (Model Training &amp; Experiment Logging)
    - name: Train Models &amp; Log Experiments
      run: |
        python step2_feature_engineering_model_training.py
        python step3_experiment_tracking.py

    # 9. Step 4 Execution (Packaging Verification)
    - name: Verify Model Packaging &amp; Reproducibility
      run: |
        python step4_model_packaging.py

    # 10. Upload Workflow Artifacts (Trained Model &amp; EDA Figures)
    - name: Upload Model &amp; Figure Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: trained-ml-artifacts
        path: |
          models/
          reports/figures/
          test-reports/

```
